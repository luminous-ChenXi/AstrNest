<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 粉色到薄荷绿渐变 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <!-- 薄荷绿到浅蓝渐变 -->
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="38" y="38" width="180" height="180"
        rx="36" ry="36"
        fill="url(#gradient1)" filter="url(#shadow)"/>

  <!-- 图片图标 - 使用白色 -->
  <g fill="none" stroke="white" stroke-width="10.24" stroke-linecap="round" stroke-linejoin="round">
    <!-- 图片外框 -->
    <rect x="74" y="83"
          width="108" height="90"
          rx="9" ry="9"/>
    <!-- 山脉 -->
    <polyline points="74,155 101,128 128,146 182,110"/>
    <!-- 太阳/月亮 -->
    <circle cx="155" cy="110" r="14.4"/>
  </g>

  <!-- 右上角装饰小圆点 -->
  <circle cx="191" cy="65"
          r="14.4" fill="white" opacity="0.6"/>
</svg>