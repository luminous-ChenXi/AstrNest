<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 粉色到薄荷绿渐变 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <!-- 薄荷绿到浅蓝渐变 -->
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="19" y="19" width="90" height="90"
        rx="18" ry="18"
        fill="url(#gradient1)" filter="url(#shadow)"/>

  <!-- 图片图标 - 使用白色 -->
  <g fill="none" stroke="white" stroke-width="5.12" stroke-linecap="round" stroke-linejoin="round">
    <!-- 图片外框 -->
    <rect x="37" y="41.5"
          width="54" height="45"
          rx="4.5" ry="4.5"/>
    <!-- 山脉 -->
    <polyline points="37,77.5 50.5,64 64,73 91,55"/>
    <!-- 太阳/月亮 -->
    <circle cx="77.5" cy="55" r="7.2"/>
  </g>

  <!-- 右上角装饰小圆点 -->
  <circle cx="95.5" cy="32.5"
          r="7.2" fill="white" opacity="0.6"/>
</svg>