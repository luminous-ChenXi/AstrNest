<?xml version="1.0" encoding="UTF-8"?>
<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 粉色到薄荷绿渐变 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <!-- 薄荷绿到浅蓝渐变 -->
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="2" y="2" width="12" height="12"
        rx="2" ry="2"
        fill="url(#gradient1)" filter="url(#shadow)"/>

  <!-- 图片图标 - 使用白色 -->
  <g fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 图片外框 -->
    <rect x="4.4" y="5"
          width="7.199999999999999" height="6"
          rx="0.6000000000000001" ry="0.6000000000000001"/>
    <!-- 山脉 -->
    <polyline points="4.4,9.8 6.199999999999999,8 8,9.2 11.600000000000001,6.800000000000001"/>
    <!-- 太阳/月亮 -->
    <circle cx="9.8" cy="6.800000000000001" r="0.96"/>
  </g>

  <!-- 右上角装饰小圆点 -->
  <circle cx="12.2" cy="3.8"
          r="0.96" fill="white" opacity="0.6"/>
</svg>