<?xml version="1.0" encoding="UTF-8"?>
<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 粉色到薄荷绿渐变 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <!-- 薄荷绿到浅蓝渐变 -->
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="14" y="14" width="68" height="68"
        rx="13" ry="13"
        fill="url(#gradient1)" filter="url(#shadow)"/>

  <!-- 图片图标 - 使用白色 -->
  <g fill="none" stroke="white" stroke-width="3.84" stroke-linecap="round" stroke-linejoin="round">
    <!-- 图片外框 -->
    <rect x="27.6" y="31"
          width="40.8" height="34"
          rx="3.4000000000000004" ry="3.4000000000000004"/>
    <!-- 山脉 -->
    <polyline points="27.6,58.2 37.8,48 48,54.8 68.4,41.2"/>
    <!-- 太阳/月亮 -->
    <circle cx="58.2" cy="41.2" r="5.44"/>
  </g>

  <!-- 右上角装饰小圆点 -->
  <circle cx="71.8" cy="24.2"
          r="5.44" fill="white" opacity="0.6"/>
</svg>