<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 粉色到薄荷绿渐变 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <!-- 薄荷绿到浅蓝渐变 -->
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="9" y="9" width="46" height="46"
        rx="9" ry="9"
        fill="url(#gradient1)" filter="url(#shadow)"/>

  <!-- 图片图标 - 使用白色 -->
  <g fill="none" stroke="white" stroke-width="2.56" stroke-linecap="round" stroke-linejoin="round">
    <!-- 图片外框 -->
    <rect x="18.200000000000003" y="20.5"
          width="27.599999999999998" height="23"
          rx="2.3000000000000003" ry="2.3000000000000003"/>
    <!-- 山脉 -->
    <polyline points="18.200000000000003,38.900000000000006 25.099999999999998,32 32,36.599999999999994 45.800000000000004,27.400000000000002"/>
    <!-- 太阳/月亮 -->
    <circle cx="38.900000000000006" cy="27.400000000000002" r="3.68"/>
  </g>

  <!-- 右上角装饰小圆点 -->
  <circle cx="48.1" cy="15.899999999999999"
          r="3.68" fill="white" opacity="0.6"/>
</svg>