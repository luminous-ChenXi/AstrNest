<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 粉色到薄荷绿渐变 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b9d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff8fab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:1" />
    </linearGradient>
    <!-- 薄荷绿到浅蓝渐变 -->
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#87ceeb;stop-opacity:1" />
    </linearGradient>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
  </defs>

  <!-- 背景圆角矩形 -->
  <rect x="7" y="7" width="34" height="34"
        rx="6" ry="6"
        fill="url(#gradient1)" filter="url(#shadow)"/>

  <!-- 图片图标 - 使用白色 -->
  <g fill="none" stroke="white" stroke-width="1.92" stroke-linecap="round" stroke-linejoin="round">
    <!-- 图片外框 -->
    <rect x="13.8" y="15.5"
          width="20.4" height="17"
          rx="1.7000000000000002" ry="1.7000000000000002"/>
    <!-- 山脉 -->
    <polyline points="13.8,29.1 18.9,24 24,27.4 34.2,20.6"/>
    <!-- 太阳/月亮 -->
    <circle cx="29.1" cy="20.6" r="2.72"/>
  </g>

  <!-- 右上角装饰小圆点 -->
  <circle cx="35.9" cy="12.1"
          r="2.72" fill="white" opacity="0.6"/>
</svg>