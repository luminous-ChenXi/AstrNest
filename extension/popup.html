<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>辰汐图床</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      min-height: 480px;
      font-family: 'Plus Jakarta Sans', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fff5f7 0%, #f0fdfa 50%, #f0f9ff 100%);
    }

    .container {
      background: rgba(255, 255, 255, 0.7);
      min-height: 100%;
      backdrop-filter: blur(20px);
    }

    /* 头部 */
    .header {
      background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #4ecdc4 100%);
      padding: 28px 24px;
      color: white;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2) 0%, transparent 50%);
      pointer-events: none;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.2);
      padding: 8px;
      position: relative;
      z-index: 1;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
      position: relative;
      z-index: 1;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
      position: relative;
      z-index: 1;
    }

    /* 用户卡片 */
    .user-card {
      margin: -24px 20px 20px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 8px 30px rgba(255, 107, 157, 0.15);
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 107, 157, 0.1);
      position: relative;
      z-index: 2;
    }

    .user-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(255, 107, 157, 0.2);
    }

    .user-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 3px;
    }

    .user-status {
      font-size: 13px;
      color: #ff6b9d;
      font-weight: 500;
    }

    .user-status.logged-in {
      color: #4ecdc4;
    }

    .user-arrow {
      color: #ff6b9d;
      font-size: 18px;
      font-weight: 300;
    }

    /* 快捷操作 */
    .quick-actions {
      padding: 0 20px 20px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #4a4a6a;
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .action-item {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 107, 157, 0.1);
      border-radius: 14px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .action-item:hover {
      border-color: rgba(255, 107, 157, 0.3);
      background: rgba(255, 255, 255, 1);
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(255, 107, 157, 0.15);
    }

    .action-icon {
      width: 36px;
      height: 36px;
      margin: 0 auto 10px;
      background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 18px;
      box-shadow: 0 4px 12px rgba(255, 107, 157, 0.3);
    }

    .action-item:nth-child(2) .action-icon {
      background: linear-gradient(135deg, #4ecdc4 0%, #2ecc71 100%);
      box-shadow: 0 4px 12px rgba(78, 205, 196, 0.3);
    }

    .action-item:nth-child(3) .action-icon {
      background: linear-gradient(135deg, #87ceeb 0%, #4ecdc4 100%);
      box-shadow: 0 4px 12px rgba(135, 206, 235, 0.3);
    }

    .action-item span {
      font-size: 12px;
      color: #4a4a6a;
      display: block;
      font-weight: 500;
    }

    /* 上传区域 */
    .upload-section {
      padding: 0 20px 20px;
    }

    .upload-area {
      border: 2px dashed rgba(255, 107, 157, 0.3);
      border-radius: 16px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.8);
    }

    .upload-area:hover {
      border-color: #ff6b9d;
      background: rgba(255, 107, 157, 0.05);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(255, 107, 157, 0.12);
    }

    .upload-icon {
      width: 44px;
      height: 44px;
      margin: 0 auto 14px;
      color: #ff6b9d;
    }

    .upload-text {
      font-size: 14px;
      color: #1a1a2e;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .upload-hint {
      font-size: 12px;
      color: #ff6b9d;
    }

    /* 底部链接 */
    .footer {
      padding: 20px;
      text-align: center;
      border-top: 1px solid rgba(255, 107, 157, 0.1);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 14px;
    }

    .footer-links a {
      font-size: 12px;
      color: #ff6b9d;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .footer-links a:hover {
      color: #ff4d8d;
      text-decoration: underline;
    }

    .footer-copyright {
      font-size: 11px;
      color: #4a4a6a;
      opacity: 0.7;
    }

    /* 登录模态框 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(26, 26, 46, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: linear-gradient(135deg, #fff5f7 0%, #f0fdfa 50%, #f0f9ff 100%);
      border-radius: 20px;
      width: 90%;
      max-width: 340px;
      padding: 28px;
      box-shadow: 0 30px 80px rgba(255, 107, 157, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .modal-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      font-size: 20px;
      color: #1a1a2e;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .modal-header p {
      font-size: 13px;
      color: #4a4a6a;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: #4a4a6a;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(255, 107, 157, 0.2);
      border-radius: 12px;
      font-size: 14px;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.9);
      color: #1a1a2e;
    }

    .form-group input:focus {
      outline: none;
      border-color: #ff6b9d;
      box-shadow: 0 0 0 4px rgba(255, 107, 157, 0.1);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
    }

    .btn-secondary {
      background: rgba(78, 205, 196, 0.1);
      color: #4ecdc4;
      margin-top: 10px;
      border: 1px solid rgba(78, 205, 196, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(78, 205, 196, 0.2);
    }

    /* 隐藏的文件输入 */
    #file-input {
      display: none;
    }

    /* 加载状态 */
    .loading {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid #fff;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <img src="icons/icon-48.png" alt="辰汐图床" class="logo">
      <h1>辰汐图床</h1>
      <p>快速、稳定的图片托管服务</p>
    </div>

    <!-- 用户卡片 -->
    <div class="user-card" id="user-card">
      <img src="https://luminouschenxi.net/assets/img/avatar.png" alt="头像" class="user-avatar" id="user-avatar">
      <div class="user-info">
        <div class="user-name" id="user-name">未登录</div>
        <div class="user-status" id="user-status">点击登录</div>
      </div>
      <span class="user-arrow">›</span>
    </div>

    <!-- 快捷操作 -->
    <div class="quick-actions">
      <div class="section-title">快捷操作</div>
      <div class="action-grid">
        <div class="action-item" id="action-upload">
          <div class="action-icon">📤</div>
          <span>上传图片</span>
        </div>
        <div class="action-item" id="action-gallery">
          <div class="action-icon">🖼️</div>
          <span>我的图库</span>
        </div>
        <div class="action-item" id="action-screenshot">
          <div class="action-icon">📷</div>
          <span>截图上传</span>
        </div>
      </div>
    </div>

    <!-- 上传区域 -->
    <div class="upload-section">
      <div class="section-title">拖拽上传</div>
      <div class="upload-area" id="upload-area">
        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="17 8 12 3 7 8"></polyline>
          <line x1="12" y1="3" x2="12" y2="15"></line>
        </svg>
        <div class="upload-text">拖拽图片到这里上传</div>
        <div class="upload-hint">或点击选择文件</div>
      </div>
      <input type="file" id="file-input" multiple accept="image/*,video/*">
    </div>

    <!-- 底部 -->
    <div class="footer">
      <div class="footer-links">
        <a href="#" id="link-website">访问官网</a>
        <a href="#" id="link-help">使用帮助</a>
        <a href="#" id="link-feedback">反馈建议</a>
      </div>
      <div class="footer-copyright">© 2024 辰汐图床 AstrNest</div>
    </div>
  </div>

  <!-- 登录模态框 -->
  <div class="modal-overlay" id="login-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>登录辰汐图床</h2>
        <p>登录后可管理您的图片</p>
      </div>
      <form id="login-form">
        <div class="form-group">
          <label>用户名/邮箱</label>
          <input type="text" id="login-username" placeholder="请输入用户名或邮箱" required>
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" id="login-password" placeholder="请输入密码" required>
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">登录</button>
        <button type="button" class="btn btn-secondary" id="cancel-login">取消</button>
      </form>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
