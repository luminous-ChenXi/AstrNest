spring:
  datasource:
    hikari:
      minimum-idle: ${ASTRNEST_DB_MIN_IDLE:10}
      maximum-pool-size: ${ASTRNEST_DB_MAX_POOL_SIZE:50}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        show_sql: false

# 生产环境关闭 OpenAPI 文档端点（/v3/api-docs、/swagger-ui），与 SecurityConfig 仅 dev
# profile 放行 swagger 的策略互为双保险；确需临时开放时用环境变量 SPRINGDOC_API_DOCS_ENABLED=true 覆盖
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.chenxi.astrnest: INFO
    org.springframework.security: WARN
  file:
    name: /var/log/astrnest/application.log
    max-size: 10MB
    max-history: 30

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
