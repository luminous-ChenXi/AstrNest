server:
  port: 8080

spring:
  application:
    name: astrnest-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: ${ASTRNEST_MULTIPART_MAX_FILE_SIZE:20MB}
      max-request-size: ${ASTRNEST_MULTIPART_MAX_REQUEST_SIZE:20MB}
      resolve-lazily: true

astrnest:
  storage:
    strategy: ${ASTRNEST_STORAGE_STRATEGY:LOCAL}
    local:
      root: ${ASTRNEST_STORAGE_ROOT:./storage/upload}
      public-base-url: ${ASTRNEST_STORAGE_PUBLIC:/upload}
  api-key:
    header-name: ${ASTRNEST_API_KEY_HEADER:X-API-Key}
    default-daily-quota: ${ASTRNEST_API_DEFAULT_QUOTA:1000}
  video-thumbnail:
    enabled: ${ASTRNEST_VIDEO_THUMBNAIL_ENABLED:true}
    ffmpeg-path: ${ASTRNEST_VIDEO_THUMBNAIL_FFMPEG:ffmpeg}
    capture-offset: ${ASTRNEST_VIDEO_THUMBNAIL_CAPTURE:PT1S}
    quality: ${ASTRNEST_VIDEO_THUMBNAIL_QUALITY:2}
    timeout-seconds: ${ASTRNEST_VIDEO_THUMBNAIL_TIMEOUT:20}
    cover-directory: ${ASTRNEST_VIDEO_THUMBNAIL_SUBDIR:cover}
