name: Release

# 推送 v* tag 时触发：产出 Release 附件（jar / 前端 dist / 扩展 zip）并发布 GHCR 镜像，
# 用户因此可以直接 docker pull，不必本机从源码构建（docs/audit-report-2026-10-05.md P1-16）。
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Package backend jar
      run: cd backend && ./mvnw -B -DskipTests package

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Build frontend
      run: cd frontend && npm ci && npm run build

    - name: Zip frontend dist
      run: cd frontend && zip -qr ../astrnest-frontend-dist.zip dist

    - name: Zip browser extension
      run: cd extension && zip -qr ../astrnest-extension.zip .

    - name: Compute lowercase image base
      run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & push backend image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_BASE }}/backend:${{ github.ref_name }}
          ${{ env.IMAGE_BASE }}/backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build & push frontend image
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_BASE }}/frontend:${{ github.ref_name }}
          ${{ env.IMAGE_BASE }}/frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        files: |
          backend/target/backend-*.jar
          astrnest-frontend-dist.zip
          astrnest-extension.zip
