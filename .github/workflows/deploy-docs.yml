name: Deploy AstrNest Docs to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'AstrNest-docs/**'
      - '.github/workflows/deploy-docs.yml'
  
  # 允许手动触发部署
  workflow_dispatch:

# 设置 GITHUB_TOKEN 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 构建工作
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: AstrNest-docs/package-lock.json
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Install dependencies
      run: cd AstrNest-docs && npm ci
      
    - name: Build documentation
      run: cd AstrNest-docs && npm run build
      
    - name: Setup Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: AstrNest-docs/.vitepress/dist

  # 部署工作
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4